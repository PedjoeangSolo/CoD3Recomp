plugins {
    id "com.android.application"
}

android {
    namespace "com.pedjoeangsolo.cod3recomp"
    compileSdk 35

    defaultConfig {
        applicationId "com.pedjoeangsolo.cod3recomp"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0-android-smoke"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
}
